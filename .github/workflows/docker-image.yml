name: Build and Push Docker Image

on:
  pull_request:
    branches: master
  push:
    branches: master

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mongo: [ 7 ]

    # see https://github.com/marketplace/actions/docker-buildx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Docker Buildx (build)
        run: |
          docker buildx build \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --cache-to "type=local,dest=/tmp/.buildx-cache" \
            --platform linux/amd64,linux/arm64 \
            --build-arg MONGO_MAJOR_VERSION=${{ matrix.mongo }} \
            --output "type=image,push=false" \
            --tag ghcr.io/ev-freaks/mongodb-s3-backup:${{ matrix.mongo }} \
            --file ./Dockerfile ./

      # only needed to push, so it's skipped entirely on PR runs - no reason to authenticate
      # against the registry until we're actually about to publish
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # gated to the push event: PR runs only build the image; merging to master is what
      # actually publishes it, so unreviewed PR code can't overwrite the shared :7 tag
      - name: Docker Buildx (push)
        if: github.event_name == 'push'
        run: |
          docker buildx build \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --platform linux/amd64,linux/arm64 \
            --build-arg MONGO_MAJOR_VERSION=${{ matrix.mongo }} \
            --output "type=image,push=true" \
            --tag ghcr.io/ev-freaks/mongodb-s3-backup:${{ matrix.mongo }} \
            --file ./Dockerfile ./

      - name: Inspect image
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect ghcr.io/ev-freaks/mongodb-s3-backup:${{ matrix.mongo }}
